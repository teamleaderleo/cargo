name: Fieldwork Cargo 16574 patch-source probe

on:
  push:
    branches:
      - fieldwork/16574-patch-source-fetch
    paths:
      - .github/workflows/fieldwork-16574-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run current contract control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fieldwork/16574/results
          cargo test --test testsuite patch::patch_git -- --nocapture \
            2>&1 | tee fieldwork/16574/results/current-contract.txt

      - name: Add proposed no-fetch contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/testsuite/patch.rs')
          text = path.read_text()
          marker = '''\n#[cargo_test]\nfn patch_to_git() {'''
          test = r'''

#[cargo_test]
fn config_path_patch_can_replace_unreachable_git_dependency_without_fetch() {
    let source = "ssh://127.0.0.1:9/foo-dep.git";
    let p = project()
        .file(
            "Cargo.toml",
            &format!(
                r#"
                    [package]
                    name = "cargo-patch-test"
                    version = "0.0.1"

                    [dependencies.foo-dep]
                    git = "{source}"
                "#,
            ),
        )
        .file(
            ".cargo/config.toml",
            &format!(
                r#"
                    [patch."{source}"]
                    foo-dep = {{ path = "foo-dep" }}
                "#,
            ),
        )
        .file("src/lib.rs", "pub fn local() -> bool { foo_dep::local() }")
        .file("foo-dep/Cargo.toml", &basic_manifest("foo-dep", "0.1.0"))
        .file("foo-dep/src/lib.rs", "pub fn local() -> bool { true }")
        .build();

    p.cargo("check")
        .env("CARGO_NET_RETRY", "0")
        .with_stderr_data(str![[r#"
[LOCKING] 1 package to latest compatible version
[CHECKING] foo-dep v0.1.0 ([ROOT]/foo/foo-dep)
[CHECKING] cargo-patch-test v0.0.1 ([ROOT]/foo)
[FINISHED] `dev` profile [unoptimized + debuginfo] target(s) in [ELAPSED]s

"#]])
        .run();
}
'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected patch_to_git marker')
          path.write_text(text.replace(marker, test + marker, 1))
          PY
          git diff --check

      - name: Execute proposed contract and require product-path failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --test testsuite \
            patch::config_path_patch_can_replace_unreachable_git_dependency_without_fetch \
            -- --nocapture \
            > fieldwork/16574/results/proposed-contract.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq 'failed to (load source|clone|fetch)|unable to update|Connection refused' \
            fieldwork/16574/results/proposed-contract.txt
          printf 'exit_status=%s\n' "$status" > fieldwork/16574/results/status.txt
          git checkout -- tests/testsuite/patch.rs
          git diff --check

      - name: Record receipt and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          cat > fieldwork/16574/receipt.md <<EOF
          # Cargo 16574 execution receipt

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Starting head: ${GITHUB_SHA}
          - Runner: ubuntu-latest with repository Rust toolchain
          - Current contract control: \`patch::patch_git\` passed and exercised the existing source-update behavior.
          - Proposed contract: a path patch for \`ssh://127.0.0.1:9/foo-dep.git\` still attempted the original source and failed on the product path.
          - The proposed test was reverted after execution; canonical product source remains unchanged.
          - Gates: current focused test, proposed focused failing test with product-failure assertion, and \`git diff --check\`.
          - Evidence class: target-executed focused positive and negative controls; design remains unresolved.
          - Disposition: HOLD production change until exact replacement semantics and companion controls are accepted.
          - Upstream contact: unauthorized and absent.
          EOF
          rm .github/workflows/fieldwork-16574-probe.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add fieldwork/16574 .github/workflows/fieldwork-16574-probe.yml
          git commit -m "Record Cargo patch-source contract probe [fieldwork executed]"
          git push origin HEAD:fieldwork/16574-patch-source-fetch
